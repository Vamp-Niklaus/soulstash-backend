name: CI Quality Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gates:
    name: Build, Vet, Lint & Race Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Verify Module Dependencies
        run: |
          go mod verify
          go mod tidy --diff || true

      - name: Go Format Check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted Go code detected:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run Unit Tests with Race Detector
        run: go test -race -v -coverprofile=coverage.out ./...

      - name: Run Integration Tests
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: soulstash_test
        run: go test -tags=integration -race -v ./...

      - name: Build Binary
        run: go build -v ./cmd/server
